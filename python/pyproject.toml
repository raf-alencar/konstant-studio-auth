[project]
name = "konstant-studio-auth"
version = "0.2.0"
description = "Shared Clerk + Cloudflare Access auth dependencies for FastAPI services."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Raf Alencar" }]
license = { text = "UNLICENSED" }
dependencies = [
    # python-jose is needed by the legacy v1 modules (auth.py) and by v2's Clerk verification.
    # >=3.4.0 carries the fixes for CVE-2024-33663 / CVE-2024-33664.
    "python-jose[cryptography]>=3.4.0,<4",
    "httpx>=0.27,<1",
    "svix>=1.40,<2",
    "fastapi>=0.110,<1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["konstant_studio_auth*"]
