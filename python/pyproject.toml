[project]
name = "konstant-studio-auth"
version = "0.1.0"
description = "Shared Clerk + Cloudflare Access auth dependencies for FastAPI services."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Raf Alencar" }]
license = { text = "UNLICENSED" }
dependencies = [
    "clerk-backend-api",
    "python-jose[cryptography]",
    "httpx",
    "svix",
    "fastapi",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["konstant_studio_auth*"]
